<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Entre em contato com a equipe SpaceThon — envie sua mensagem ou dúvida.">
  <title>SpaceThon | Contato</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/variaveis.css">
  <link rel="stylesheet" href="css/contato.css">
</head>
<body>

  <!-- ========== HEADER / NAVEGAÇÃO ========== -->
  <header class="header">
    <div class="container header-content">

      <a href="index.html" class="logo">
        <img src="assets/logo.png" alt="Logo SpaceThon" class="logo-img">
        Space<span>Thon</span>
      </a>

      <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="nav" id="navMenu">
        <ul class="nav-list">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="sobre.html" class="nav-link">Sobre</a></li>
          <li><a href="integrantes.html" class="nav-link">Integrantes</a></li>
          <li><a href="faq.html" class="nav-link">FAQ</a></li>
          <li><a href="contato.html" class="nav-link ativo">Contato</a></li>
          <li class="nav-separator"></li>
          <li><a href="solucao.html" class="nav-link">Tecnologia</a></li>
          <li><a href="mercado.html" class="nav-link">Mercado B2B</a></li>
        </ul>
      </nav>

    </div>
  </header>

  <main>

    <!-- ========== BANNER DA PÁGINA ========== -->
    <section class="page-banner">
      <div class="container">
        <h1 class="page-titulo">Fale <span>Conosco</span></h1>
        <p class="page-subtitulo">Envie sua dúvida ou mensagem para a equipe SpaceThon.</p>
      </div>
    </section>

    <!-- ========== FORMULÁRIO ========== -->
    <section class="secao">
      <div class="container">

        <form class="formulario" id="formContato" novalidate>

          <!-- Nome -->
          <div class="campo">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Seu nome completo">
            <span class="erro-msg" id="erroNome"></span>
          </div>

          <!-- E-mail -->
          <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com">
            <span class="erro-msg" id="erroEmail"></span>
          </div>

          <!-- Tipo de dúvida -->
          <div class="campo">
            <label for="tipo">Tipo de dúvida</label>
            <select id="tipo" name="tipo">
              <option value="" disabled selected>Selecione uma opção</option>
              <option value="geral">Dúvida geral</option>
              <option value="projeto">Sobre o projeto</option>
              <option value="parceria">Parceria / B2B</option>
              <option value="outro">Outro</option>
            </select>
            <span class="erro-msg" id="erroTipo"></span>
          </div>

          <!-- Mensagem -->
          <div class="campo">
            <label for="mensagem">Mensagem</label>
            <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem aqui..."></textarea>
            <span class="erro-msg" id="erroMensagem"></span>
          </div>

          <!-- Botão -->
          <button type="submit" class="btn-primario btn-enviar">Enviar Mensagem</button>

          <!-- Mensagem de sucesso -->
          <p class="sucesso-msg" id="msgSucesso">Mensagem enviada com sucesso!</p>

        </form>

      </div>
    </section>

  </main>

  <!-- ========== FOOTER ========== -->
  <footer class="footer">
    <div class="container footer-content">
      <p class="footer-logo">
        <img src="assets/logo.png" alt="Logo SpaceThon" class="footer-logo-img">
        Space<span>Thon</span>
      </p>
      <p>&copy; 2026 Global Solution — FIAP. Todos os direitos reservados.</p>
    </div>
  </footer>

  <!-- Botão Voltar ao Topo -->
  <button id="btnTopo" class="btn-topo" aria-label="Voltar ao topo">↑</button>

  <!-- JS -->
  <script src="js/menu.js"></script>
  <script src="js/contato.js"></script>
</body>
</html>
